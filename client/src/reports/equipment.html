<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>تقرير العتاد — Amin-Lab -cem🔬</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/reports/shared/report-styles.css" />
    <link rel="stylesheet" href="/reports/shared/print-styles.css" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/assets/icons/favicon.png" />
  </head>
  <body data-report="equipment">
    <div class="app-shell">
      <aside class="sidebar" id="sidebar"></aside>
      <main class="content">
        <header class="topbar no-print">
          <div><h1>تقرير العتاد</h1><p>العتاد المستعار والمتبقي والتالف</p></div>
          <div class="toolbar">
            <div class="field"><label for="from">من</label><input id="from" type="date" /></div>
            <div class="field"><label for="to">إلى</label><input id="to" type="date" /></div>
            <button class="btn" type="button" id="csvBtn">⬇️ CSV</button>
            <button class="btn" type="button" id="xlsBtn">📊 Excel</button>
            <button class="btn btn-primary" type="button" id="printBtn">🖨️ PDF</button>
          </div>
        </header>
        <article class="report-sheet" id="report"><div class="empty">جارٍ تحميل التقرير…</div></article>
      </main>
    </div>
    <script src="/app.js"></script>
    <script src="/reports/shared/report-templates.js"></script>
    <script src="/reports/shared/table-report.js"></script>
  </body>
</html>
