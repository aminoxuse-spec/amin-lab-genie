<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>تسجيل الدخول — Amin-Lab -Pro🔬</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/x-icon" href="/assets/icons/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon.png" />
    <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#0f766e" />
  </head>
  <body class="login-page">
    <main class="login-card">
      <div class="brand-mark login-logo" data-brand>AL</div>
      <h1 data-app-name>Amin-Lab -Pro🔬</h1>
      <p>نظام إدارة مختبر العلوم: الجرد، الإعارة، استعمال الزمن، فحص الجودة والتقارير.</p>

      <form id="loginForm">
        <div class="field u-margin-bottom-0-8rem">
          <label for="username">اسم المستخدم</label>
          <input id="username" name="username" autocomplete="username" required minlength="3" placeholder="admin" />
        </div>
        <div class="field u-margin-bottom-1rem">
          <label for="password">كلمة المرور</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required minlength="6" placeholder="••••••••" />
        </div>
        <button class="btn btn-primary" type="submit" id="submitBtn" class="u-width-100-justify-content-center">دخول</button>
      </form>

      <div class="login-hint">
        بيانات الدخول الحالية في ملف <code>data/credentials.txt</code> على الخادم (آخر سطر لكل حساب هو الأحدث).<br />
        غيّر كلمة المرور بعد أول دخول: <code>npm run set-password -- admin</code>
      </div>
    </main>

    <script src="/i18n.js"></script>
    <script src="/app.js"></script>
    <script src="/index.js"></script>
  </body>
</html>
