<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>الأساتذة — Amin-Lab -Pro🔬</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/x-icon" href="/assets/icons/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon.png" />
    <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar"></aside>
      <main class="content">
        <header class="topbar">
          <div>
            <h1>الأساتذة</h1>
            <p>أساتذة العلوم الفيزيائية وعلوم الطبيعة والحياة المستفيدون من المخبر.</p>
          </div>
          <div id="pageActions"></div>
        </header>

        <div class="teacher-search">
          <input id="search" placeholder="ابحث بالاسم، القسم أو الهاتف…" />
          <span class="teacher-search-ico">🔎</span>
        </div>

        <div class="teacher-grid" id="teacherCards">
          <div class="empty">جارٍ التحميل…</div>
        </div>
      </main>
    </div>

    <div class="modal" id="teacherModal">
      <div class="modal-box">
        <h2 id="teacherModalTitle">أستاذ جديد</h2>
        <form id="teacherForm">
          <input type="hidden" id="teacherId" />
          <div class="form-grid">
            <div class="field"><label for="teacherName">الاسم الكامل</label><input id="teacherName" required minlength="3" maxlength="80" /></div>
            <div class="field"><label for="teacherUsername">اسم المستخدم</label><input id="teacherUsername" required minlength="3" maxlength="40" autocomplete="off" /></div>
            <div class="field"><label for="teacherPhone">الهاتف</label><input id="teacherPhone" maxlength="30" dir="ltr" placeholder="05xxxxxxxx" /></div>
            <div class="field"><label for="teacherRole">الدور</label><select id="teacherRole"><option value="teacher">أستاذ</option><option value="admin">مدير</option></select></div>
            <div class="field"><label for="teacherSpecialty">التخصص</label><select id="teacherSpecialty"><option value="">—</option><option value="physics">علوم فيزيائية</option><option value="natural">علوم الطبيعة والحياة</option></select></div>
            <div class="field"><label for="teacherPassword">كلمة المرور</label><input id="teacherPassword" type="password" minlength="6" autocomplete="new-password" /></div>
          </div>
          <p class="muted" id="teacherPasswordHint" class="u-margin-top-45rem">كلمة المرور مطلوبة عند الإنشاء، واختيارية عند التعديل.</p>
          <div class="modal-actions">
            <button class="btn" type="button" data-close="teacherModal">إلغاء</button>
            <button class="btn btn-primary" type="submit">حفظ</button>
          </div>
        </form>
      </div>
    </div>

    <script src="/i18n.js"></script>
    <script src="/app.js"></script>
    <script src="/actions.js"></script>
    <script src="/teachers.js"></script>
  </body>
</html>
