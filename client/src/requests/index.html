<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>طلبات الأساتذة — Amin-Lab -Pro🔬</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/x-icon" href="/assets/icons/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon.png" />
    <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar"></aside>
      <main class="content">
        <header class="topbar">
          <div>
            <h1>طلبات الأساتذة</h1>
            <p>طلبات الوسائل والإعارة الواردة من تطبيق الهاتف — وافق أو ارفض، والموافقة تُنشئ جلسة إعارة</p>
          </div>
          <div class="row-actions">
            <a class="btn" href="/mobile/index.html" target="_blank" rel="noopener">📱 تطبيق الأساتذة</a>
            <button class="btn" type="button" id="refreshBtn">⟳ تحديث</button>
          </div>
        </header>

        <section class="grid cols-4" id="requestStats" class="u-margin-bottom-1rem"></section>

        <section class="card">
          <div class="card-head">
            <h2>الطلبات</h2>
            <span class="badge info" id="requestsBadge">…</span>
          </div>
          <div class="row-actions" id="statusChips" class="u-margin-bottom-8rem">
            <button class="btn btn-primary" type="button" data-status="pending">المعلّقة</button>
            <button class="btn" type="button" data-status="approved">المقبولة</button>
            <button class="btn" type="button" data-status="rejected">المرفوضة</button>
            <button class="btn" type="button" data-status="">الكل</button>
          </div>
          <div id="requestsBody"><div class="empty">جارٍ التحميل…</div></div>
        </section>
      </main>
    </div>

    <script src="/i18n.js"></script>
    <script src="/app.js"></script>
    <script src="/requests/index.js"></script>
  </body>
</html>
